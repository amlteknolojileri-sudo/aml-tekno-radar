name: Günlük AML Tekno Radar Taraması & Bülten Dağıtımı

on:
  schedule:
    # Her sabah saat 06:00 TSİ (03:00 UTC) otomatik çalışır
    - cron: '0 3 * * *'
  workflow_dispatch: # GitHub Actions panelinden tek tıkla manuel çalıştırma butonu

jobs:
  daily-scan-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write # Repoya güncellenen verileri commit & push yapabilme izni

    env:
      TZ: 'Europe/Istanbul'

    steps:
      - name: Depoyu Klonla (Checkout)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Node.js Ortamını Hazırla
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Bağımlılıkları Yükle
        run: npm ci || npm install

      - name: Canlı Veri Taraması (Reddit + Apify Twitter + arXiv) & DeepSeek Analizi
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_AUTHORITIES_TOKEN: ${{ secrets.APIFY_AUTHORITIES_TOKEN || secrets.APIFY_TOKEN }}
        run: npm run crawl

      - name: Arayüzü Derle (Build Test)
        run: npm run build

      - name: Günlük AML Bültenini Hazırla ve E-Posta ile Gönder
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALICI_MAIL: ${{ secrets.ALICI_MAIL }}
        run: npm run newsletter

      - name: Yeni Verileri ve Arşivi Git Deposuna Kaydet (Push)
        run: |
          git config --global user.name "AML Radar Bot"
          git config --global user.email "bot@amlteknoradar.com"
          git add src/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Günlük AML Raporu & Arşiv Güncellemesi [skip ci]" && git push)
